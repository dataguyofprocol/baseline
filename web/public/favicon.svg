<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="baseline-bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6e79d6"/>
      <stop offset="100%" stop-color="#4f5bbd"/>
    </linearGradient>
    <filter id="baseline-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood="#0b0b0f" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#baseline-bg)"/>
  <g filter="url(#baseline-shadow)">
    <line x1="7" y1="16" x2="25" y2="16" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="16" cy="16" r="4.5" fill="url(#baseline-bg)" stroke="#fff" stroke-width="2.5"/>
  </g>
</svg>
