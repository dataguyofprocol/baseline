# Baseline for one organization. Copy .env.example to .env, fill it in, then `docker compose up -d`.
# HTTPS with Caddy: compose.https.yaml (switch it on with COMPOSE_FILE in .env).
services:
  baseline:
    build: .
    image: baseline:local
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    # the published port below maps to 7770, so a BASELINE_PORT in .env must not move the server off it
    environment:
      BASELINE_PORT: "7770"
    ports:
      - "${BASELINE_PUBLISH:-7770}:7770"
    volumes:
      - baseline-data:/data

volumes:
  baseline-data:
